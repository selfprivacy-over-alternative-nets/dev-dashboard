<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="549px" preserveAspectRatio="none" style="width:858px;height:549px;background:#FFFFFF;" version="1.1" viewBox="0 0 858 549" width="858px" zoomAndPan="magnify"><title>How to set up and test a SelfPrivacy box &#8212; 3 steps</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="349.2986" x="253.3073" y="34.9659">How to set up and test a SelfPrivacy box &#8212; 3 steps</text></g><ellipse cx="257.2878" cy="60.0679" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EEF3FB" height="85.3765" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="411.8389" x="51.3683" y="90.0679"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="71.7245" x="61.3683" y="112.896">0. Get ready</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="34.4042" x="136.2128" y="112.896">(once)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="391.8389" x="61.3683" y="129.2401">cable the new device to this laptop, turn it on in "network boot" mode</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="357.0507" x="61.3683" y="145.5842">(it shows its own MAC on screen), then start the address server:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="245.2458" x="61.3683" y="161.9283">sudo bash /netboot/start-netboot-server.sh</text><rect fill="#EEF3FB" height="69.0323" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="464.9031" x="24.8362" y="195.4444"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="103.9927" x="34.8362" y="218.2725">1. Find the device</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="19.7881" x="34.8362" y="234.6166">run</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="105.6367" x="60.8644" y="234.6166">./dash find-target</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="444.9031" x="34.8362" y="250.9607">&#8594; it prints the device's MAC + IP, e.g.  MAC 80:e8:2c:15:81:8b  IP 192.168.100.29</text><rect fill="#EEF3FB" height="85.3765" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="492.5755" x="11" y="284.4767"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="94.7526" x="21" y="307.3048">2. Install onto it</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="19.7881" x="21" y="323.6489">run</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="248.0657" x="47.0282" y="323.6489">./dash run install.cable-0d --on cable-0d ...</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="170.8333" x="301.334" y="323.6489">with the MAC + IP from step 1,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="472.5755" x="21" y="339.993">your web address, and your wifi name + password (full command below the picture)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="294.2661" x="21" y="356.3371">&#8594; it asks "erase which disk?", then installs and prints</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="30.0002" x="318.3862" y="356.3371">done</text><path d="M464.097,379.8532 L464.097,433.9712 L444.097,437.9712 L464.097,441.9712 L464.097,496.0893 A0,0 0 0 0 464.097,496.0893 L846.9133,496.0893 A0,0 0 0 0 846.9133,496.0893 L846.9133,389.8532 L836.9133,379.8532 L464.097,379.8532 A0,0 0 0 0 464.097,379.8532" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M836.9133,379.8532 L836.9133,389.8532 L846.9133,389.8532 L836.9133,379.8532" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="145.1971" x="470.097" y="398.7502">Where your secrets go</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="349.1283" x="470.097" y="416.4562">The wifi password, the app secret key (token) and the TLS</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="272.3892" x="470.097" y="434.1622">certificate are written only into the installer's</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.649" x="745.8663" y="434.1622">state/</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="344.3443" x="470.097" y="451.8682">folder on THIS computer. It is never uploaded or pushed</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="361.8163" x="470.097" y="469.5743">(git-ignored + excluded from the backup). To back it up too,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="254.1632" x="470.097" y="487.2803">lock the whole folder with ONE password:</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="39.559" x="731.0202" y="487.2803">age -p</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="3.484" x="770.5793" y="487.2803">.</text><rect fill="#EEF3FB" height="69.0323" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="373.6186" x="70.4785" y="403.4551"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="138.361" x="80.4785" y="426.2831">3. Test the running box</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="19.7881" x="80.4785" y="442.6273">run</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="253.8258" x="106.5067" y="442.6273">./dash run L3.connect.desktop ... --token ...</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="9.5281" x="80.4785" y="458.9714">&#8594;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="96.7567" x="93.1266" y="458.9714">green = it works</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="234.8537" x="199.2433" y="458.9714">(red = something is off, the log says what)</text><ellipse cx="257.2878" cy="527.0893" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="257.2878" cy="527.0893" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="257.2878" x2="257.2878" y1="70.0679" y2="90.0679"/><polygon fill="#181818" points="253.2878,80.0679,257.2878,90.0679,261.2878,80.0679,257.2878,84.0679" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="257.2878" x2="257.2878" y1="175.4444" y2="195.4444"/><polygon fill="#181818" points="253.2878,185.4444,257.2878,195.4444,261.2878,185.4444,257.2878,189.4444" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="257.2878" x2="257.2878" y1="264.4767" y2="284.4767"/><polygon fill="#181818" points="253.2878,274.4767,257.2878,284.4767,261.2878,274.4767,257.2878,278.4767" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="257.2878" x2="257.2878" y1="369.8532" y2="403.4551"/><polygon fill="#181818" points="253.2878,393.4551,257.2878,403.4551,261.2878,393.4551,257.2878,397.4551" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="257.2878" x2="257.2878" y1="472.4874" y2="516.0893"/><polygon fill="#181818" points="253.2878,506.0893,257.2878,516.0893,261.2878,506.0893,257.2878,510.0893" style="stroke:#181818;stroke-width:1;"/><!--SRC=[TLJRRjj647tdLmpS1qkmI4asaYfowY99vSH0uWQrWJuloI6v4BN3xYv52qMBFlK3YdvXlgHdLvIH0kqJkRjpENFcp9pJOyF4faozfFXGrSf0YZgsJWnLqkBirbIp9ykgF51wGvM6eOTVoNjTSBZInddLjk7Ni_DPSaxtKh8ZN1_8DM8zNP2Ll7V-Elhoaoey5T8Tqauvp_ZTxPGf7RLwpmWOhNxQlFdXqsPk-PTUMzwnyGu9df30QzyoVG1QB-G0h-z81Ln8Zm8UkAq-MxrNnO5oUQ8lV_nDLq33dKiIjzMcKrRjW4oLCcXJKwLQnr-zb5ofllMtOlozsY4Jjtlskb1VsQ02lTV-GBycH6zLiQsjzAPy9wrO-cQpkRswVHjUn9PinziNwcN-hKf-0mglh4_Mh_ERHKRlJmI_dkStD15Jy3GfL8uQ0m-6XnFRADSt6ZIfpait8zzRGzeJsWNIpWpxGUmMHOi_ensQa4pmYXOC3cQEP33qwSsxOEyAosociv32KCGJiwcojEpGFBPxjkl4zQLGhbn3lyyHFuIUH-jqFAL7oymrrx6WPKQt_nP9A2knlI72SpOlGx2WenHX8Axu_ENFlq8XdTMnpS- -vou2lg2xppFYhCuedbUBDQ_MbyLw-MAzMgvNES60bgyki-NBLRPSBBBBLqSubndTZG95EmL9_WjEE8uwpYBpwQAaD0LFpwSios9_QD2-YGXFmAYoielwekKiEKXlQU3ynEGiIlDugojD9YZgWY1yXsQLDAbwO1idW78EGnYYTxf0Uw64aHhbjexEs2h7D3IwQAZKRllzsTZ14RsBsKOQKLyf9l9_9ECgeySm8o4-IZP1_9YG_sFaurLMY35S-0ppl8Na0WlWnSiMAKT68a0ura5Gz5t06bJeZcpHn7A9MoSxXdQH4FgLgegmgPMQd3euLAJyz3enWcrWTTtu98BvkM7BH_8SGx4egfQObEBsYeoUg3o6L5qtsjAM3pI9MAV7_O3dnuyFy2tOUhWM2kaKCWnMUm_qOje3g8npnYTEsPv7Bd7mF1-pOprYiCCaFNwuUmZzwtgFCQ0x7oeqZ9d0Ncf5bQWVqz_rhk4IdfDQ-rJNHW8n5rY6HTi7cwYYa3R7DkcxANebyJymYWtdHMPmRmKtmMne11jYn155-UFzvfcCTUHFrLZHNO2S9M751twnVAJx1m00]--></g></svg>