<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="504px" preserveAspectRatio="none" style="width:929px;height:504px;background:#FFFFFF;" version="1.1" viewBox="0 0 929 504" width="929px" zoomAndPan="magnify"><title>How to set up and test a SelfPrivacy box &#8212; 3 steps</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="402.5137" x="261.8586" y="32.9951">How to set up and test a SelfPrivacy box &#8212; 3 steps</text></g><ellipse cx="275.6279" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#EEF3FB" height="75.875" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="441.0957" x="55.0801" y="87.2969"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="83.5547" x="65.0801" y="108.4355">0. Get ready</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="38.291" x="152.4492" y="108.4355">(once)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="421.0957" x="65.0801" y="122.4043">cable the new device to this laptop, turn it on in "network boot" mode</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="385.916" x="65.0801" y="136.373">(it shows its own MAC on screen), then start the address server:</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="259.0254" x="65.0801" y="150.3418">sudo bash /netboot/start-netboot-server.sh</text><rect fill="#EEF3FB" height="61.9063" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="512.4863" x="19.3848" y="183.1719"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="121.2188" x="29.3848" y="204.3105">1. Find the device</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="20.1445" x="29.3848" y="218.2793">run</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="119.1563" x="57.1582" y="218.2793">./dash find-target</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="492.4863" x="29.3848" y="232.248">&#8594; it prints the device's MAC + IP, e.g.  MAC 80:e8:2c:15:81:8b  IP 192.168.100.29</text><rect fill="#EEF3FB" height="75.875" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="529.2559" x="11" y="265.0781"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="108.2695" x="21" y="286.2168">2. Install onto it</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="20.1445" x="21" y="300.1855">run</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="222.75" x="48.7734" y="300.1855">./dash run install.lan-setup-0d ...</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="185.2207" x="279.1523" y="300.1855">with the MAC + IP from step 1,</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="509.2559" x="21" y="314.1543">your web address, and your wifi name + password (full command below the picture)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="319.3594" x="21" y="328.123">&#8594; it asks "erase which disk?", then installs and prints</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="33.5156" x="344.1738" y="328.123">done</text><path d="M502.8604,350.9531 L502.8604,397.3516 L482.8604,401.3516 L502.8604,405.3516 L502.8604,451.75 A0,0 0 0 0 502.8604,451.75 L917.231,451.75 A0,0 0 0 0 917.231,451.75 L917.231,360.9531 L907.231,350.9531 L502.8604,350.9531 A0,0 0 0 0 502.8604,350.9531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M907.231,350.9531 L907.231,360.9531 L917.231,360.9531 L907.231,350.9531" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="165.9658" x="508.8604" y="368.02">Where your secrets go</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="379.5835" x="508.8604" y="383.1528">The wifi password, the app secret key (token) and the TLS</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="294.0552" x="508.8604" y="398.2856">certificate are written only into the installer's</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="42.5039" x="807.0479" y="398.2856">state/</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="365.917" x="508.8604" y="413.4185">folder on THIS computer. It is never uploaded or pushed</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="393.3706" x="508.8604" y="428.5513">(git-ignored + excluded from the backup). To back it up too,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="270.6196" x="508.8604" y="443.6841">lock the whole folder with ONE password:</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="46.1221" x="787.7446" y="443.6841">age -p</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="833.8667" y="443.6841">.</text><rect fill="#EEF3FB" height="61.9063" rx="12.5" ry="12.5" style="stroke:#5A6B7A;stroke-width:0.5;" width="414.4648" x="68.3955" y="370.3984"/><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="158.6074" x="78.3955" y="391.5371">3. Test the running box</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="20.1445" x="78.3955" y="405.5059">run</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="294.1289" x="106.1689" y="405.5059">./dash run L3.connect.desktop ... --token ...</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="10.0547" x="78.3955" y="419.4746">&#8594;</text><text fill="#000000" font-family="Helvetica" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="112.1367" x="92.2646" y="419.4746">green = it works</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="257.0156" x="215.8447" y="419.4746">(red = something is off, the log says what)</text><ellipse cx="275.6279" cy="482.75" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="275.6279" cy="482.75" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.6279" x2="275.6279" y1="67.2969" y2="87.2969"/><polygon fill="#181818" points="271.6279,77.2969,275.6279,87.2969,279.6279,77.2969,275.6279,81.2969" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.6279" x2="275.6279" y1="163.1719" y2="183.1719"/><polygon fill="#181818" points="271.6279,173.1719,275.6279,183.1719,279.6279,173.1719,275.6279,177.1719" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.6279" x2="275.6279" y1="245.0781" y2="265.0781"/><polygon fill="#181818" points="271.6279,255.0781,275.6279,265.0781,279.6279,255.0781,275.6279,259.0781" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.6279" x2="275.6279" y1="340.9531" y2="370.3984"/><polygon fill="#181818" points="271.6279,360.3984,275.6279,370.3984,279.6279,360.3984,275.6279,364.3984" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="275.6279" x2="275.6279" y1="432.3047" y2="471.75"/><polygon fill="#181818" points="271.6279,461.75,275.6279,471.75,279.6279,461.75,275.6279,465.75" style="stroke:#181818;stroke-width:1;"/></g></svg>