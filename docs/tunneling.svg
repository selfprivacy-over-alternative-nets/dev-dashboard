<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="581px" preserveAspectRatio="none" style="width:1049px;height:581px;background:#FFFFFF;" version="1.1" viewBox="0 0 1049 581" width="1049px" zoomAndPan="magnify"><title>Reaching the SelfPrivacy backend (device B) over HTTPS &#8212; the four routes</title><defs><filter height="1" id="b12ohjweirig7q0" width="1" x="0" y="0"><feFlood flood-color="#CDEBC5" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b12ohjweirig7q1" width="1" x="0" y="0"><feFlood flood-color="#F7E7A6" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b12ohjweirig7q2" width="1" x="0" y="0"><feFlood flood-color="#FFFFFF" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="5"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="515.6321" x="260.0077" y="24.9659">Reaching the SelfPrivacy backend (device B) over HTTPS &#8212; the four routes</text></g><!--entity V--><g class="entity" data-entity="V" data-source-line="17" data-uid="ent0002" id="entity_V"><rect fill="#F1F1F1" height="77.2038" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="120.7296" x="7" y="169.1069"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="45.6958" x="17" y="194.0729">Visitor</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.7296" x="17" y="213.1408">phone / laptop,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="64.8757" x="17" y="232.2087">anywhere</text></g><!--entity B--><g class="entity" data-entity="B" data-source-line="18" data-uid="ent0003" id="entity_B"><rect fill="#EEF3FB" height="77.2038" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="150.1575" x="893.49" y="162.1069"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="57.8898" x="903.49" y="187.0729">device B</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="130.1575" x="903.49" y="206.1408">SelfPrivacy backend</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.5836" x="903.49" y="225.2087">listening on :443</text></g><!--entity T--><g class="entity" data-entity="T" data-source-line="20" data-uid="ent0004" id="entity_T"><rect fill="#F7E7A6" height="77.2038" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="150.5075" x="357.73" y="125.1069"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="87.2057" x="367.73" y="150.0729">Tunnel relay</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="126.3495" x="367.73" y="169.1408">cloudflare / ngrok /</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="130.5075" x="367.73" y="188.2087">pinggy / localtunnel</text></g><!--entity D6--><g class="entity" data-entity="D6" data-source-line="21" data-uid="ent0005" id="entity_D6"><rect fill="#CDEBC5" height="58.1358" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="120.0436" x="372.96" y="217.6369"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71.7357" x="382.96" y="242.6029">DNS AAAA</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.0436" x="382.96" y="261.6708">DuckDNS (free)</text></g><!--entity D4--><g class="entity" data-entity="D4" data-source-line="22" data-uid="ent0006" id="entity_D4"><rect fill="#F1F1F1" height="39.0679" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="62.7558" x="258.73" y="307.1769"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="42.7558" x="268.73" y="332.1429">DNS A</text></g><!--entity R--><g class="entity" data-entity="R" data-source-line="23" data-uid="ent0007" id="entity_R"><rect fill="#F1F1F1" height="58.1358" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="103.7337" x="572.12" y="323.6369"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="60.6898" x="582.12" y="348.6029">Router R</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.7337" x="582.12" y="367.6708">forward :443</text></g><!--link V to T--><g class="link" data-entity-1="V" data-entity-2="T" data-source-line="25" data-uid="lnk8" id="link_V_T"><path d="M128,200.4969 C190.76,192.8969 283.7235,181.6478 351.5635,173.4378" fill="none" id="V-to-T" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="357.52,172.7169,348.1046,169.8272,352.5562,173.3176,349.0658,177.7692,357.52,172.7169" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="31.642" x="177.73" y="184.4239">https</text></g><!--link T to B--><g class="link" data-entity-1="T" data-entity-2="B" data-source-line="26" data-uid="lnk9" id="link_T_B"><path d="M508.74,168.8969 C610.56,175.9569 785.7744,188.102 887.3344,195.142" fill="none" id="T-to-B" style="stroke:#444444;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#444444" points="893.32,195.5569,884.6182,190.9441,888.332,195.2112,884.0649,198.925,893.32,195.5569" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="119.7561" x="564.21" y="131.5939">outbound tunnel &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="157.1962" x="545.49" y="149.2999">B dials OUT, beats CGNAT</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.9351" x="546.1205" y="167.006">(centralised: via the relay)</text></g><!--link V to D6--><g class="link" data-entity-1="V" data-entity-2="D6" data-source-line="28" data-uid="lnk10" id="link_V_D6"><path d="M128.19,223.2069 C138.01,225.3269 148.11,227.2769 157.73,228.7069 C231.23,239.6769 310.8127,243.7873 366.5727,245.4573" fill="none" id="V-to-D6" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="372.57,245.6369,363.6938,241.3693,367.5722,245.4872,363.4543,249.3657,372.57,245.6369" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="69.1341" x="158.73" y="224.6039">https (IPv6)</text></g><!--link D6 to B--><g class="link" data-entity-1="D6" data-entity-2="B" data-source-line="29" data-uid="lnk11" id="link_D6_B"><path d="M493.43,242.7069 C548.06,238.9369 631.27,232.9469 703.49,226.7069 C767.51,221.1869 834.2114,214.5699 887.0814,209.1399" fill="none" id="D6-to-B" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="893.05,208.5269,883.6884,205.4674,888.0762,209.0378,884.5058,213.4255,893.05,208.5269" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="151.8922" x="548.49" y="204.6039">direct &#8212; no NAT on IPv6,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="126.0221" x="561.425" y="222.3099">just open B's firewall</text></g><!--link V to D4--><g class="link" data-entity-1="V" data-entity-2="D4" data-source-line="31" data-uid="lnk12" id="link_V_D4"><path d="M94.47,246.7169 C110.31,267.2669 132.36,290.9769 157.73,304.7069 C189.15,321.7169 224.5031,326.0153 252.3531,326.9053" fill="none" id="V-to-D4" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="258.35,327.0969,249.4824,322.8115,253.3526,326.9372,249.2268,330.8074,258.35,327.0969" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="69.1341" x="158.73" y="300.6039">https (IPv4)</text></g><!--link D4 to R--><g class="link" data-entity-1="D4" data-entity-2="R" data-source-line="32" data-uid="lnk13" id="link_D4_R"><path d="M321.73,329.1069 C378.78,333.5769 495.8584,342.748 565.7584,348.228" fill="none" id="D4-to-R" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="571.74,348.6969,563.0802,344.0057,566.7553,348.3061,562.4549,351.9813,571.74,348.6969" style="stroke:#444444;stroke-width:1;"/></g><!--link R to B--><g class="link" data-entity-1="R" data-entity-2="B" data-source-line="33" data-uid="lnk14" id="link_R_B"><path d="M676.05,354.7369 C726.58,354.5869 804.7,348.4169 863.49,316.7069 C896.71,298.7869 921.1637,270.8543 939.6937,244.6743" fill="none" id="R-to-B" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="943.16,239.7769,934.6956,244.8121,940.2714,243.8581,941.2254,249.4339,943.16,239.7769" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="78.6891" x="759.632" y="294.6039">port-forward</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="128.9731" x="734.49" y="312.3099">(needs router admin)</text></g><!--link V to B--><g class="link" data-entity-1="V" data-entity-2="B" data-source-line="35" data-uid="lnk15" id="link_V_B"><path d="M128.16,174.8269 C137.89,170.0869 147.98,165.5269 157.73,161.7069 C384.62,72.7669 463.11,68.5869 703.49,108.7069 C769.57,119.7369 835.596,143.3225 887.546,164.8225" fill="none" id="V-to-B" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="893.09,167.1169,886.3037,159.9793,888.47,165.2049,883.2444,167.3713,893.09,167.1169" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="40.846" x="382.377" y="62.2739">.onion</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="57.4731" x="426.6031" y="62.2739">via Tor &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.4732" x="352.49" y="79.9799">no DNS, no ports; Tor-only</text></g><g class="legend" data-source-line="37"><rect fill="#DDDDDD" height="162.5433" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="847.5474" x="94.0501" y="398.7728"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="45.1638" x="99.0501" y="418.7387">Scores</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="643.5498" x="155.1338" y="418.7387">A safe  &#183;  B reliable across reboot/IP-change  &#183;  C free  &#183;  D decentralised  &#183;  E human-readable name</text><text fill="#000000" filter="url(#b12ohjweirig7q0)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="14.5599" x="99.0501" y="437.8066">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="3.64" x="113.61" y="437.8066">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="155.0634" x="117.25" y="437.8066">direct IPv6 + DuckDNS</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="51.8138" x="275.9534" y="437.8066">&#8212; A B C</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="10.36" x="331.4071" y="437.8066">D</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="418.9764" x="345.4071" y="437.8066">E &#183; no relay, no port-forward &#183; ONLY if the ISP gives a public IPv6</text><text fill="#000000" filter="url(#b12ohjweirig7q1)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="14.5599" x="99.0501" y="456.8745">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="3.64" x="113.61" y="456.8745">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="85.1757" x="117.25" y="456.8745">tunnel relay</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="678.6614" x="206.0657" y="456.8745">&#8212; A B C E &#183; universal, works behind CGNAT &#183; but NOT D (3rd party); Cloudflare ToS caps video/large files</text><text fill="#000000" filter="url(#b12ohjweirig7q2)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="14.5599" x="99.0501" y="475.9424">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="3.64" x="113.61" y="475.9424">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124.4175" x="117.25" y="475.9424">port-forward IPv4</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="510.2281" x="245.3075" y="475.9424">&#8212; A B C D E &#183; but needs router admin + a real public IPv4 (dead under CGNAT)</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="80.2477" x="99.0501" y="495.0104">.onion (Tor)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="441.7963" x="182.9378" y="495.0104">&#8212; A B C D &#183; always works, no infra &#183; but not E (56-char) and Tor-only</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="13.5239" x="99.0501" y="514.0783">---</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="490.3901" x="99.0501" y="533.1462">No single route wins A-E, is grandma-proof, AND reaches every visitor.</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="837.5474" x="99.0501" y="552.2141">Product direction: auto-detect + tier &#8212; prefer direct IPv6 (decentralised), fall back to a Cloudflare tunnel; onion always available.</text></g></g></svg>