<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="529px" preserveAspectRatio="none" style="width:1114px;height:529px;background:#FFFFFF;" version="1.1" viewBox="0 0 1114 529" width="1114px" zoomAndPan="magnify"><title>Reaching the SelfPrivacy backend (device B) over HTTPS &#8212; the four routes</title><defs><filter height="1" id="b12ohjweirig7q0" width="1" x="0" y="0"><feFlood flood-color="#CDEBC5" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b12ohjweirig7q1" width="1" x="0" y="0"><feFlood flood-color="#F7E7A6" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="b12ohjweirig7q2" width="1" x="0" y="0"><feFlood flood-color="#FFFFFF" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="5"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="592.2861" x="254.1853" y="22.9951">Reaching the SelfPrivacy backend (device B) over HTTPS &#8212; the four routes</text></g><!--entity V--><g class="entity" data-entity="V" data-source-line="17" data-uid="ent0002" id="entity_V"><rect fill="#F1F1F1" height="68.8906" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="126.1758" x="7" y="150.6628"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="51.9805" x="17" y="173.6579">Visitor</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="106.1758" x="17" y="189.9548">phone / laptop,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="69.043" x="17" y="206.2517">anywhere</text></g><!--entity B--><g class="entity" data-entity="B" data-source-line="18" data-uid="ent0003" id="entity_B"><rect fill="#EEF3FB" height="68.8906" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="161.3467" x="947.31" y="144.6628"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="66.7803" x="957.31" y="167.6579">device B</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.3467" x="957.31" y="183.9548">SelfPrivacy backend</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="117.4756" x="957.31" y="200.2517">listening on :443</text></g><!--entity T--><g class="entity" data-entity="T" data-source-line="20" data-uid="ent0004" id="entity_T"><rect fill="#F7E7A6" height="68.8906" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="158.5576" x="377.03" y="108.6628"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="98.3896" x="387.03" y="131.6579">Tunnel relay</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="132.6514" x="387.03" y="147.9548">cloudflare / ngrok /</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="138.5576" x="387.03" y="164.2517">pinggy / localtunnel</text></g><!--entity D6--><g class="entity" data-entity="D6" data-source-line="21" data-uid="ent0005" id="entity_D6"><rect fill="#CDEBC5" height="52.5938" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="128.8828" x="391.86" y="197.8128"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="81.6348" x="401.86" y="220.8079">DNS AAAA</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="108.8828" x="401.86" y="237.1048">DuckDNS (free)</text></g><!--entity D4--><g class="entity" data-entity="D4" data-source-line="22" data-uid="ent0006" id="entity_D4"><rect fill="#F1F1F1" height="36.2969" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="69.1299" x="270.18" y="281.9528"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="49.1299" x="280.18" y="304.9479">DNS A</text></g><!--entity R--><g class="entity" data-entity="R" data-source-line="23" data-uid="ent0007" id="entity_R"><rect fill="#F1F1F1" height="52.5938" rx="5" ry="5" style="stroke:#555555;stroke-width:0.5;" width="109.8105" x="605.4" y="299.8128"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="69.1113" x="615.4" y="322.8079">Router R</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.8105" x="615.4" y="339.1048">forward :443</text></g><!--link V to T--><g class="link" data-entity-1="V" data-entity-2="T" data-source-line="25" data-uid="lnk8" id="link_V_T"><path d="M133.67,178.2628 C200.02,171.0128 298.9755,160.1944 370.8255,152.3444" fill="none" id="V-to-T" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="376.79,151.6928,367.4088,148.6939,371.8196,152.2358,368.2777,156.6466,376.79,151.6928" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="33.4585" x="185.18" y="162.8697">https</text></g><!--link T to B--><g class="link" data-entity-1="T" data-entity-2="B" data-source-line="26" data-uid="lnk9" id="link_T_B"><path d="M535.92,148.0728 C644.12,154.9128 831.912,166.7742 940.892,173.6642" fill="none" id="T-to-B" style="stroke:#444444;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#444444" points="946.88,174.0428,938.1503,169.4829,941.89,173.7273,937.6455,177.467,946.88,174.0428" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="124.9155" x="597.9423" y="116.9497">outbound tunnel &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="169.2793" x="575.7604" y="132.0825">B dials OUT, beats CGNAT</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="172.1802" x="574.31" y="147.2153">(centralised: via the relay)</text></g><!--link V to D6--><g class="link" data-entity-1="V" data-entity-2="D6" data-source-line="28" data-uid="lnk10" id="link_V_D6"><path d="M133.28,199.9228 C143.23,201.9228 153.45,203.7428 163.18,205.1028 C241.31,216.0728 326.1233,220.5238 385.4933,222.4938" fill="none" id="V-to-D6" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="391.49,222.6928,382.6276,218.3965,386.4928,222.527,382.3623,226.3921,391.49,222.6928" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="75.3721" x="164.18" y="201.1697">https (IPv6)</text></g><!--link D6 to B--><g class="link" data-entity-1="D6" data-entity-2="B" data-source-line="29" data-uid="lnk11" id="link_D6_B"><path d="M521,219.0728 C625.37,210.8328 826.6487,194.9357 940.8487,185.9057" fill="none" id="D6-to-B" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="946.83,185.4328,937.5427,182.1547,941.8456,185.8269,938.1733,190.1298,946.83,185.4328" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="161.8271" x="579.81" y="182.6697">direct &#8212; no NAT on IPv6,</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="135.1797" x="593.1337" y="197.8025">just open B's firewall</text></g><!--link V to D4--><g class="link" data-entity-1="V" data-entity-2="D4" data-source-line="31" data-uid="lnk12" id="link_V_D4"><path d="M95.21,219.7528 C111.8,240.7628 135.75,266.1328 163.18,280.1028 C196.67,297.1728 234.1403,300.9401 263.8203,301.2501" fill="none" id="V-to-D4" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="269.82,301.3128,260.8623,297.219,264.8203,301.2606,260.7787,305.2186,269.82,301.3128" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="75.3721" x="164.18" y="276.1697">https (IPv4)</text></g><!--link D4 to R--><g class="link" data-entity-1="D4" data-entity-2="R" data-source-line="32" data-uid="lnk13" id="link_D4_R"><path d="M339.64,302.6028 C401.09,307.1128 525.3361,316.2529 599.2061,321.6829" fill="none" id="D4-to-R" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="605.19,322.1228,596.5075,317.4738,600.2035,321.7562,595.921,325.4522,605.19,322.1228" style="stroke:#444444;stroke-width:1;"/></g><!--link R to B--><g class="link" data-entity-1="R" data-entity-2="B" data-source-line="33" data-uid="lnk14" id="link_R_B"><path d="M715.7,327.6728 C769.63,327.0728 853.24,320.2328 917.31,288.1028 C951.62,270.8928 978.064,243.5818 998.044,218.6918" fill="none" id="R-to-B" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="1001.8,214.0128,993.0467,218.5273,998.67,217.9119,999.2854,223.5352,1001.8,214.0128" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="81.4087" x="806.7951" y="269.1697">port-forward</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="138.3789" x="778.31" y="284.3025">(needs router admin)</text></g><!--link V to B--><g class="link" data-entity-1="V" data-entity-2="B" data-source-line="35" data-uid="lnk15" id="link_V_B"><path d="M133.57,153.9528 C143.35,149.6628 153.44,145.5428 163.18,142.1028 C252.16,110.6628 275.62,102.5228 369.31,91.1028 C612.12,61.5128 683.25,71.0328 917.31,142.1028 C926.92,145.0228 931.2571,146.3482 941.1971,149.5982" fill="none" id="V-to-B" style="stroke:#444444;stroke-width:1;"/><polygon fill="#444444" points="946.9,151.4628,939.5887,144.8639,942.1476,149.9089,937.1026,152.4678,946.9,151.4628" style="stroke:#444444;stroke-width:1;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="45.7666" x="400.6042" y="56.9297">.onion</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="61.7754" x="450.5031" y="56.9297">via Tor &#8212;</text><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="172.2627" x="370.31" y="72.0625">no DNS, no ports; Tor-only</text></g><g class="legend" data-source-line="37"><rect fill="#DDDDDD" height="140.375" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="916.8828" x="91.8869" y="369.4065"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="52.7324" x="96.8869" y="387.4017">Scores</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="698.0313" x="162.9699" y="387.4017">A safe  &#183;  B reliable across reboot/IP-change  &#183;  C free  &#183;  D decentralised  &#183;  E human-readable name</text><text fill="#000000" filter="url(#b12ohjweirig7q0)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="17.8008" x="96.8869" y="403.6985">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="114.6877" y="403.6985">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="179.5186" x="119.1379" y="403.6985">direct IPv6 + DuckDNS</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="56.3076" x="303.1067" y="403.6985">&#8212; A B C</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="11.6211" x="363.8645" y="403.6985">D</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="450.7002" x="379.9358" y="403.6985">E &#183; no relay, no port-forward &#183; ONLY if the ISP gives a public IPv6</text><text fill="#000000" filter="url(#b12ohjweirig7q1)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="17.8008" x="96.8869" y="419.9954">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="114.6877" y="419.9954">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="95.5322" x="119.1379" y="419.9954">tunnel relay</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="734.4053" x="219.1203" y="419.9954">&#8212; A B C E &#183; universal, works behind CGNAT &#183; but NOT D (3rd party); Cloudflare ToS caps video/large files</text><text fill="#000000" filter="url(#b12ohjweirig7q2)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="17.8008" x="96.8869" y="436.2923">&#160;&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="4.4502" x="114.6877" y="436.2923">&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="140.1777" x="119.1379" y="436.2923">port-forward IPv4</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="554.7363" x="263.7658" y="436.2923">&#8212; A B C D E &#183; but needs router admin + a real public IPv4 (dead under CGNAT)</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="93.0303" x="96.8869" y="452.5892">.onion (Tor)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="480.6006" x="194.3674" y="452.5892">&#8212; A B C D &#183; always works, no infra &#183; but not E (56-char) and Tor-only</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="15.1553" x="96.8869" y="468.886">---</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="560.4854" x="96.8869" y="485.1829">No single route wins A-E, is grandma-proof, AND reaches every visitor.</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="906.8828" x="96.8869" y="501.4798">Product direction: auto-detect + tier &#8212; prefer direct IPv6 (decentralised), fall back to a Cloudflare tunnel; onion always available.</text></g></g></svg>