<text x="20" y="368" font-size="11" text-anchor="start" font-weight="normal" fill="#555">transports:  tor = .onion over SOCKS · https = clearnet (system/LE-trusted cert) · chutney = private Tor net (vm-local only).</text>
<text x="20" y="388" font-size="11" text-anchor="start" font-weight="normal" fill="#555">Live per-flow × network pass/fail is in the matrix dashboard — its setup columns are the backend machine; .desktop/.android tests are the frontend.</text>
<text x="20" y="408" font-size="11" text-anchor="start" font-weight="normal" fill="#777">L1/L2 are backend-only (a throwaway test-VM, no frontend); only L3 pairs a frontend device with a persistent backend machine.</text>
