<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1043px" preserveAspectRatio="none" style="width:507px;height:1043px;background:#FFFFFF;" version="1.1" viewBox="0 0 507 1043" width="507px" zoomAndPan="magnify"><title>What the installer is made of &#8212; and what &lt;b&gt;you&lt;/b&gt; have to provide</title><defs><filter height="1" id="bn2g55kob3qvu0" width="1" x="0" y="0"><feFlood flood-color="#E8F5E9" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu1" width="1" x="0" y="0"><feFlood flood-color="#E3F0FB" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu2" width="1" x="0" y="0"><feFlood flood-color="#FFF3E0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu3" width="1" x="0" y="0"><feFlood flood-color="#FBE9E7" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu4" width="1" x="0" y="0"><feFlood flood-color="#ECEFF1" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="3"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="288.9449" x="30.8868" y="24.9659">What the installer is made of &#8212; and what</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="25.8299" x="323.4717" y="24.9659">you</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="109.1716" x="352.9416" y="24.9659">have to provide</text></g><g class="legend" data-source-line="13"><rect fill="#DDDDDD" height="124.4075" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="437.6283" x="12" y="52.0679"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="162.7214" x="17" y="72.0339">What the colours mean</text><text fill="#000000" filter="url(#bn2g55kob3qvu0)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="10.92" x="17" y="91.1018">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.5689" x="35.1999" y="91.1018">green &#8212; same for everyone, you do nothing</text><text fill="#000000" filter="url(#bn2g55kob3qvu1)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="10.92" x="17" y="110.1697">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4348" x="35.1999" y="110.1697">blue &#8212; found automatically from your device</text><text fill="#000000" filter="url(#bn2g55kob3qvu2)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="10.92" x="17" y="129.2376">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.6151" x="35.1999" y="129.2376">amber &#8212; about you: you type this in</text><text fill="#000000" filter="url(#bn2g55kob3qvu3)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="10.92" x="17" y="148.3055">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.3633" x="35.1999" y="148.3055">red &#8212; the fiddly internet bit</text><text fill="#000000" filter="url(#bn2g55kob3qvu4)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="10.92" x="17" y="167.3734">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="409.4284" x="35.1999" y="167.3734">grey &#8212; &#128274; your secrets: stay on your computer, never uploaded</text></g><!--cluster D--><g class="cluster" data-entity="D" data-source-line="22" data-uid="ent0002" id="cluster_D"><path d="M8.5,196.0774 L177.1634,196.0774 A3.75,3.75 0 0 1 179.6634,198.5774 L186.6634,221.1453 L497.5,221.1453 A2.5,2.5 0 0 1 500,223.6453 L500,1033.5974 A2.5,2.5 0 0 1 497.5,1036.0974 L8.5,1036.0974 A2.5,2.5 0 0 1 6,1033.5974 L6,198.5774 A2.5,2.5 0 0 1 8.5,196.0774" fill="#FAFAFA" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="6" x2="186.6634" y1="221.1453" y2="221.1453"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="167.6634" x="10" y="213.0433">The SelfPrivacy installer</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="23" data-uid="ent0003" id="entity_a1"><rect fill="#E8F5E9" height="58.1358" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="349.2927" x="78.35" y="234.0774"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="275.225" x="88.35" y="259.0433">The SelfPrivacy app + the installer itself</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="329.2927" x="88.35" y="278.1113">You provide: nothing &#8212; it's the same for everyone</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="24" data-uid="ent0004" id="entity_a2"><rect fill="#E3F0FB" height="77.2038" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="322.3148" x="91.84" y="352.2174"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="253.903" x="101.84" y="377.1833">Which computer &amp; which disk to use</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="302.3148" x="101.84" y="396.2513">You provide: nothing &#8212; it detects your device;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.321" x="101.84" y="415.3192">you just confirm which disk gets erased</text></g><!--entity a3--><g class="entity" data-entity="a3" data-source-line="25" data-uid="ent0005" id="entity_a3"><rect fill="#FFF3E0" height="58.1358" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="361.7246" x="72.14" y="489.4174"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="225.1052" x="82.14" y="514.3833">How it gets online (wifi or cable)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="341.7246" x="82.14" y="533.4513">You provide: your wifi name + password (only if wifi)</text></g><!--entity a4--><g class="entity" data-entity="a4" data-source-line="26" data-uid="ent0006" id="entity_a4"><rect fill="#FFF3E0" height="58.1358" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="424.8645" x="40.57" y="607.5574"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="275.239" x="50.57" y="632.5233">Your web address + its security padlock</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="404.8645" x="50.57" y="651.5913">You provide: your web address (e.g. selfprivacy.example.com)</text></g><!--entity a5--><g class="entity" data-entity="a5" data-source-line="27" data-uid="ent0007" id="entity_a5"><rect fill="#FFF3E0" height="58.1358" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="400.3085" x="52.85" y="725.6874"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="274.7069" x="62.85" y="750.6533">Your admin login + the app's secret key</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="380.3085" x="62.85" y="769.7213">You provide: nothing &#8212; made on the device automatically</text></g><!--entity a6--><g class="entity" data-entity="a6" data-source-line="28" data-uid="ent0008" id="entity_a6"><rect fill="#FBE9E7" height="58.1358" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="462.9723" x="21.51" y="843.8274"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="267.651" x="31.51" y="868.7933">Keeping the security padlock renewed</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="442.9723" x="31.51" y="887.8613">You provide: a web-address provider (automatic with a normal one)</text></g><!--entity a7--><g class="entity" data-entity="a7" data-source-line="29" data-uid="ent0009" id="entity_a7"><rect fill="#ECEFF1" height="58.1358" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="426.5199" x="39.74" y="961.9574"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="152.1129" x="49.74" y="986.9233">&#128274; Your private secrets</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="250.767" x="205.4929" y="986.9233">(keys &#183; padlock &#183; wifi &amp; app passwords)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="397.9345" x="49.74" y="1005.9913">Stored ONLY on your computer &#8212; never uploaded or shared</text></g><!--link a1 to a2--><!--link a2 to a3--><!--link a3 to a4--><!--link a4 to a5--><!--link a5 to a6--><!--link a6 to a7--></g></svg>