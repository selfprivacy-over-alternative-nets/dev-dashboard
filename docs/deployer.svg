<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="978px" preserveAspectRatio="none" style="width:541px;height:978px;background:#FFFFFF;" version="1.1" viewBox="0 0 541 978" width="541px" zoomAndPan="magnify"><title>What the installer is made of &#8212; and what &lt;b&gt;you&lt;/b&gt; have to provide</title><defs><filter height="1" id="bn2g55kob3qvu0" width="1" x="0" y="0"><feFlood flood-color="#E8F5E9" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu1" width="1" x="0" y="0"><feFlood flood-color="#E3F0FB" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu2" width="1" x="0" y="0"><feFlood flood-color="#FFF3E0" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu3" width="1" x="0" y="0"><feFlood flood-color="#FBE9E7" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter><filter height="1" id="bn2g55kob3qvu4" width="1" x="0" y="0"><feFlood flood-color="#ECEFF1" result="flood"/><feComposite in="SourceGraphic" in2="flood" operator="over"/></filter></defs><g><g class="title" data-source-line="3"><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="326.7988" x="18.8315" y="22.9951">What the installer is made of &#8212; and what</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="28.7109" x="350.5044" y="22.9951">you</text><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="124.0791" x="384.0894" y="22.9951">have to provide</text></g><g class="legend" data-source-line="13"><rect fill="#DDDDDD" height="107.7813" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="465.1025" x="12" y="49.2969"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="183.3604" x="17" y="67.292">What the colours mean</text><text fill="#000000" filter="url(#bn2g55kob3qvu0)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="13.3506" x="17" y="83.5889">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="309.9482" x="39.251" y="83.5889">green &#8212; same for everyone, you do nothing</text><text fill="#000000" filter="url(#bn2g55kob3qvu1)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="13.3506" x="17" y="99.8857">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.8867" x="39.251" y="99.8857">blue &#8212; found automatically from your device</text><text fill="#000000" filter="url(#bn2g55kob3qvu2)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="13.3506" x="17" y="116.1826">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.7646" x="39.251" y="116.1826">amber &#8212; about you: you type this in</text><text fill="#000000" filter="url(#bn2g55kob3qvu3)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="13.3506" x="17" y="132.4795">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.1113" x="39.251" y="132.4795">red &#8212; the fiddly internet bit</text><text fill="#000000" filter="url(#bn2g55kob3qvu4)" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="13.3506" x="17" y="148.7764">&#160;&#160;&#160;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="432.8516" x="39.251" y="148.7764">grey &#8212; &#128274; your secrets: stay on your computer, never uploaded</text></g><!--cluster D--><g class="cluster" data-entity="D" data-source-line="22" data-uid="ent0002" id="cluster_D"><path d="M8.5,176.0781 L201.9248,176.0781 A3.75,3.75 0 0 1 204.4248,178.5781 L211.4248,198.375 L531.5,198.375 A2.5,2.5 0 0 1 534,200.875 L534,969.0281 A2.5,2.5 0 0 1 531.5,971.5281 L8.5,971.5281 A2.5,2.5 0 0 1 6,969.0281 L6,178.5781 A2.5,2.5 0 0 1 8.5,176.0781" fill="#FAFAFA" style="stroke:#000000;stroke-width:1.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="6" x2="211.4248" y1="198.375" y2="198.375"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="192.4248" x="10" y="191.0732">The SelfPrivacy installer</text></g><!--entity a1--><g class="entity" data-entity="a1" data-source-line="23" data-uid="ent0003" id="entity_a1"><rect fill="#E8F5E9" height="52.5938" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="373.1172" x="83.44" y="211.0781"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="319.5049" x="93.44" y="234.0732">The SelfPrivacy app + the installer itself</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="353.1172" x="93.44" y="250.3701">You provide: nothing &#8212; it's the same for everyone</text></g><!--entity a2--><g class="entity" data-entity="a2" data-source-line="24" data-uid="ent0004" id="entity_a2"><rect fill="#E3F0FB" height="68.8906" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="345.835" x="97.08" y="323.6681"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="288.0459" x="107.08" y="346.6632">Which computer &amp; which disk to use</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="325.835" x="107.08" y="362.9601">You provide: nothing &#8212; it detects your device;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.3047" x="107.08" y="379.257">you just confirm which disk gets erased</text></g><!--entity a3--><g class="entity" data-entity="a3" data-source-line="25" data-uid="ent0005" id="entity_a3"><rect fill="#FFF3E0" height="52.5938" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="390.9385" x="74.53" y="452.5581"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="258.1934" x="84.53" y="475.5532">How it gets online (wifi or cable)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="370.9385" x="84.53" y="491.8501">You provide: your wifi name + password (only if wifi)</text></g><!--entity a4--><g class="entity" data-entity="a4" data-source-line="26" data-uid="ent0006" id="entity_a4"><rect fill="#FFF3E0" height="52.5938" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="458.7646" x="40.62" y="565.1481"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="317.5635" x="50.62" y="588.1432">Your web address + its security padlock</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="438.7646" x="50.62" y="604.4401">You provide: your web address (e.g. selfprivacy.example.com)</text></g><!--entity a5--><g class="entity" data-entity="a5" data-source-line="27" data-uid="ent0007" id="entity_a5"><rect fill="#FFF3E0" height="52.5938" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="428.2012" x="55.9" y="677.7481"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="315.916" x="65.9" y="700.7432">Your admin login + the app's secret key</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="408.2012" x="65.9" y="717.0401">You provide: nothing &#8212; made on the device automatically</text></g><!--entity a6--><g class="entity" data-entity="a6" data-source-line="28" data-uid="ent0008" id="entity_a6"><rect fill="#FBE9E7" height="52.5938" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="495.5283" x="22.24" y="790.3381"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="303.7412" x="32.24" y="813.3332">Keeping the security padlock renewed</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="475.5283" x="32.24" y="829.6301">You provide: a web-address provider (automatic with a normal one)</text></g><!--entity a7--><g class="entity" data-entity="a7" data-source-line="29" data-uid="ent0009" id="entity_a7"><rect fill="#ECEFF1" height="52.5938" rx="7" ry="7" style="stroke:#777777;stroke-width:0.5;" width="463.0576" x="38.47" y="902.9381"/><text fill="#000000" font-family="Helvetica" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="165.2861" x="48.47" y="925.9332">&#128274; Your private secrets</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.3213" x="218.2063" y="925.9332">(keys &#183; padlock &#183; wifi &amp; app passwords)</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="422.1738" x="48.47" y="942.2301">Stored ONLY on your computer &#8212; never uploaded or shared</text></g><!--link a1 to a2--><!--link a2 to a3--><!--link a3 to a4--><!--link a4 to a5--><!--link a5 to a6--><!--link a6 to a7--></g></svg>